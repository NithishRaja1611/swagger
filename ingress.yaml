apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aspnet-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: aspnet.local  # Replace or remove for external IP-based access
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aspnet-service
                port:
                  number: 80
